name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine toml pytest

      - name: Install package and run tests
        run: |
          pip install -e .
          pytest tests/ -v

      - name: Bump patch version
        id: bump
        run: |
          python - <<'EOF'
          import toml, os

          with open("pyproject.toml") as f:
              data = toml.load(f)

          version = data["project"]["version"]
          major, minor, patch = map(int, version.split("."))
          new_version = f"{major}.{minor}.{patch + 1}"
          data["project"]["version"] = new_version

          with open("pyproject.toml", "w") as f:
              toml.dump(data, f)

          print(f"Bumped {version} → {new_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={new_version}\n")
          EOF
        env:
          GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

[build-system]
requires = [ "setuptools>=68", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-portable-memory"
version = "0.1.6"
description = "Portable compressed memory for AI agents — works with any LLM"
readme = "README.md"
requires-python = ">=3.9"
keywords = [ "ai", "memory", "llm", "chatgpt", "claude", "portable",]
dependencies = [ "click>=8.1", "rich>=13.0", "openai>=1.0", "anthropic>=0.25", "python-dotenv>=1.0",]

[project.license]
text = "MIT"

[project.optional-dependencies]
supabase = [ "supabase>=2.0",]
s3 = [ "boto3>=1.34",]
firebase = [ "firebase-admin>=6.0",]
gemini = [ "google-generativeai>=0.8",]
mistral = [ "mistralai>=1.0",]
ollama = [ "requests>=2.31",]
all = [ "supabase>=2.0", "boto3>=1.34", "firebase-admin>=6.0", "google-generativeai>=0.8", "mistralai>=1.0", "requests>=2.31",]
dev = [ "pytest>=8.0",]

[project.scripts]
memory = "memory.cli:cli"

[tool.pytest.ini_options]
testpaths = [ "tests",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "memory*",]
